name: Verify live Draft Lab release
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-draft-lab.yml"
      - "scripts/check-live-draft-lab.sh"
  workflow_run:
    workflows: ["Deploy pre-launch landing"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout reviewed verification source only
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check script syntax
        run: bash -n scripts/check-live-draft-lab.sh
      - name: Check actual public HTTPS pages and scripts without secrets
        run: bash scripts/check-live-draft-lab.sh
