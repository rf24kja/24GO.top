name: Tests and checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate external HTTPS audit shell syntax
        run: bash -n scripts/check-live-seo.sh
      - run: npm run check
      - run: npm test
      - name: Real Chromium mobile layout smoke (PUBLIC repo only)
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            CHROME_BIN="$(command -v google-chrome)" npm run mobile:check
          elif command -v chromium >/dev/null 2>&1; then
            CHROME_BIN="$(command -v chromium)" npm run mobile:check
          else
            echo "::error::No Chromium browser installed on public runner"
            exit 1
          fi
