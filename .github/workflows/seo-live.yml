name: External SEO availability audit

on:
  # Do not run concurrently with a source push. Pages might still serve
  # the previous HTML, making a correct release fail its new content probe.
  # Evidence: push audit #41208632019 failed while Pages #41208631961
  # was deploying; completed-Pages audit #41208664348 then passed.
  workflow_run:
    workflows: ["Deploy pre-launch landing"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily independent GitHub-hosted runner check; no crawler/index claim.
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  check-public-site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Check public DNS, TLS, canonical and content
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Static shell syntax
        run: bash -n scripts/check-live-seo.sh
      - name: Probe real public website without secrets
        run: bash scripts/check-live-seo.sh
