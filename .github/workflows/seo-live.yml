name: External SEO availability audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-live.yml"
      - "scripts/check-live-seo.sh"
  # Verify the actual public release only after Pages finishes deploying.
  # workflow_run checks out the default branch; it never handles PR secrets.
  workflow_run:
    workflows: ["Deploy pre-launch landing"]
    types: [completed]
  workflow_dispatch:
  schedule:
    # Daily independent GitHub-hosted runner check; no crawler/index claim.
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  check-public-site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Check public DNS, TLS, canonical and content
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Static shell syntax
        run: bash -n scripts/check-live-seo.sh
      - name: Probe real public website without secrets
        run: bash scripts/check-live-seo.sh
