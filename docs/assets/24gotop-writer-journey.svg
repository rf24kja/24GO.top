<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">24GOTOP writing workflow: local Draft Lab available, hosted publishing gated</title>
<desc id="desc">The available browser-only workflow has four local steps: write Markdown, preview safely, export a file, and reopen the file later. A separate dashed lower track shows planned hosted identity verification, moderation and publication; none of these public user publishing steps are live.</desc>
