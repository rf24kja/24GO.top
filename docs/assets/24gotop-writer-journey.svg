<text x="44" y="55" font-size="30" font-weight="800" fill="#F3FFF7">THE WRITING JOURNEY</text>
<text x="45" y="84" font-size="17" fill="#B6D7C6">Two different pathways. Only the browser-local path is available today.</text>
<rect x="44" y="103" width="116" height="27" rx="13" fill="#235D42"/>
<text x="61" y="122" font-weight="700" font-size="13" fill="#D3FCE4">AVAILABLE</text>
