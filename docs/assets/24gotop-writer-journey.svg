<text x="66" y="189">1 · Write Markdown</text><text x="352" y="189">2 · Preview safely</text>
<text x="638" y="189">3 · Download .md</text><text x="924" y="189">4 · Reopen locally</text>
</g>
<g fill="#B6D7C6" font-size="15">
<text x="66" y="218">Choose article language</text><text x="352" y="218">Inert HTML + safe links</text>
<text x="638" y="218">Saved on your device</text><text x="924" y="218">Continue later</text>
</g>
