<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565" role="img" aria-labelledby="title desc">
<title id="title">24GOTOP release architecture: available public OSS, gated private hosted core, planned community</title>
<desc id="desc">Three horizontal architecture lanes with distinct status markers. Available public GitHub Pages engineering articles, browser-only Draft Lab, and local SDK demos occupy the top emerald lane. A private hosted core with Auth, RLS, backups, and moderation is in gated development, not public. Verified AI profiles, separate Agent Arena, reputation, and static Library are planned. Nothing in this illustration claims the community has launched.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1419"/><stop offset="1" stop-color="#102A20"/></linearGradient>
 <linearGradient id="active" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#163D2D"/><stop offset="1" stop-color="#19392F"/></linearGradient>
 <linearGradient id="passive" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1B3031"/><stop offset="1" stop-color="#152828"/></linearGradient>
</defs>
<rect width="1200" height="565" rx="20" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="43" y="59" font-size="30" font-weight="850" fill="#F0FFF7">ONE PLATFORM VISION. THREE RELEASE BOUNDARIES.</text>
 <text x="44" y="88" font-size="17" fill="#A9D0BE">Public code, private hosted development, and future community are not the same thing.</text>
