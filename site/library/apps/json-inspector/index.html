<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>JSON Inspector — 24GOTOP Library</title>
<style>
:root{color-scheme:dark light;--bg:#101a18;--panel:#182621;--border:#476159;--text:#edf9f3;--muted:#afc6bc;--accent:#4fe6a1}
*{box-sizing:border-box}body{font:15px/1.6 system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:22px}
main{max-width:700px;margin:auto}header{margin-bottom:20px}h1{font-size:clamp(26px,5vw,37px);line-height:1.1;margin:0 0 6px}p{color:var(--muted)}
label{font-weight:750;display:block;margin:12px 0 7px}textarea{display:block;width:100%;min-height:145px;resize:vertical;border:1px solid var(--border);border-radius:11px;background:var(--panel);color:var(--text);padding:14px;font:13px/1.6 ui-monospace,monospace}
button{min-height:44px;padding:9px 16px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#07251a;font:inherit;font-weight:800;cursor:pointer;margin:12px 0}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0}
.stat{border-radius:10px;background:var(--panel);border:1px solid var(--border);padding:12px;min-width:0}
.stat strong{display:block;font-size:21px;overflow-wrap:anywhere}.stat span{font-size:11px;color:var(--muted)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;font:13px/1.6 ui-monospace,monospace}
#status[data-error="true"]{color:#ffb2ab}
@media(max-width:340px){body{padding:12px}.stats{grid-template-columns:1fr}}
@media(prefers-color-scheme:light){:root{--bg:#f5faf7;--panel:#fff;--border:#b5cec1;--text:#142620;--muted:#375c4a;--accent:#087b4e}}
</style></head><body>
<main><header><h1>JSON Inspector</h1><p>Explore structure and validate a JSON snippet, entirely on your device.</p></header>
<label for="source">JSON input · 20,000 characters maximum</label>
<textarea id="source" maxlength="20000" spellcheck="false" placeholder='{"name":"24GOTOP","topics":["AI","OSS"]}'></textarea>
<button type="button" id="inspect">Inspect JSON</button>
<p id="status" role="status" aria-live="polite">Enter JSON and choose Inspect.</p>
<section aria-label="JSON statistics">
<div class="stats"><div class="stat"><strong id="nodes">—</strong><span>Nodes</span></div>
<div class="stat"><strong id="depth">—</strong><span>Max depth</span></div>
<div class="stat"><strong id="bytes">—</strong><span>UTF-8 bytes</span></div></div>
<label for="result">Formatted JSON</label><pre id="result" tabindex="0">No output yet.</pre>
</section>
<p>Nothing is uploaded or saved. No external network calls, libraries or user accounts.</p>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
$('inspect').addEventListener('click',()=>{
 const raw=$('source').value,status=$('status');
 const fail=message=>{
  status.textContent=message;status.dataset.error='true';
  $('result').textContent='No output.';
  for(const id of ['nodes','depth','bytes'])$(id).textContent='—';
 };
 if(!raw.trim()||raw.length>20000){fail('Enter at most 20,000 characters of JSON.');return;}
 let data;
 try{data=JSON.parse(raw);}catch{fail('Invalid JSON: check syntax, quoting and commas.');return;}
 let nodes=0,depth=0;
 const stack=[{item:data,level:1}];
 while(stack.length){
  const {item,level}=stack.pop();nodes++;depth=Math.max(depth,level);
  if(nodes>15000||level>100){fail('JSON is too deeply nested or complex to inspect safely.');return;}
  if(item!==null&&typeof item==='object'){
   for(const value of Object.values(item))stack.push({item:value,level:level+1});
  }
 }
 const formatted=JSON.stringify(data,null,2);
 if(formatted.length>120000){fail('Formatted JSON is too long for the local preview.');return;}
 $('nodes').textContent=String(nodes);
 $('depth').textContent=String(depth);
 $('bytes').textContent=String(new TextEncoder().encode(raw).byteLength);
 $('result').textContent=formatted;
 status.textContent='Valid JSON. Formatted on this device.';status.dataset.error='false';
});
</script></body></html>
