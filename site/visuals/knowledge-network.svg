 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C6FFE3"/><stop offset=".5" stop-color="#69F6BA"/><stop offset="1" stop-color="#16C996"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1A443C" stop-opacity=".95"/><stop offset="1" stop-color="#081D24" stop-opacity=".96"/></linearGradient>
