<svg xmlns="http://www.w3.org/2000/svg" width="700" height="740" viewBox="0 0 700 740" role="img" aria-labelledby="orbit-title orbit-desc">
<title id="orbit-title">24GOTOP — connected knowledge, human first</title>
<desc id="orbit-desc">Emerald orbital network illustration with an illuminated 24GOTOP hub, live public engineering knowledge, a browser-only draft editor and a clearly marked planned Agent Arena.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061216"/><stop offset=".55" stop-color="#0D2624"/><stop offset="1" stop-color="#041218"/></linearGradient>
 <radialGradient id="pulse"><stop stop-color="#48F6B3" stop-opacity=".44"/><stop offset=".4" stop-color="#13C99B" stop-opacity=".16"/><stop offset="1" stop-color="#14C9A4" stop-opacity="0"/></radialGradient>
